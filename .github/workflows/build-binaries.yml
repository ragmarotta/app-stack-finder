name: Build Standalone Binaries (Linux & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: app-stack-finder-linux
            binary_path: dist/app-stack-finder
          - os: windows-latest
            artifact_name: app-stack-finder-windows.exe
            binary_path: dist/app-stack-finder.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --clean app-stack-finder.spec

      - name: Test Executable Help Output (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/app-stack-finder
          ./dist/app-stack-finder --help

      - name: Test Executable Help Output (Windows)
        if: runner.os == 'Windows'
        run: |
          dist\app-stack-finder.exe --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
